<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campo de Fluídos - Fly Relaxamento</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            background-color: #0f1117;
            color: #c8d2e1;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body class="relative w-screen h-screen select-none">

    <!-- HUD DE NAVEGAÇÃO / SAÍDA -->
    <div id="hud" class="absolute top-4 left-4 z-40 flex items-center gap-3 bg-slate-900/85 backdrop-blur border border-slate-800 px-4 py-2 rounded-xl shadow-lg flex-wrap">
        <span id="titulo-modo-atual" class="text-xs md:text-sm text-slate-300 font-semibold">Campo de Fluídos</span>
        <span class="text-slate-600">|</span>
        <span class="text-[11px] text-slate-400">Clique: cores <span id="label-paleta" class="text-sky-300 font-mono">atual</span></span>

        <div id="controles-fluido" class="flex items-center gap-3 ml-1 pl-3 border-l border-slate-700 flex-wrap">
            <div class="flex items-center gap-1.5">
                <span class="text-xs text-slate-400">Velocidade:</span>
                <button id="btn-vel-menos" class="w-6 h-6 bg-slate-800 hover:bg-slate-700 text-sky-400 rounded flex items-center justify-center font-bold text-xs cursor-pointer" aria-label="Diminuir velocidade">-</button>
                <span id="label-vel" class="text-xs font-mono text-sky-300 w-10 text-center">1.00x</span>
                <button id="btn-vel-mais" class="w-6 h-6 bg-slate-800 hover:bg-slate-700 text-sky-400 rounded flex items-center justify-center font-bold text-xs cursor-pointer" aria-label="Aumentar velocidade">+</button>
            </div>
            <span class="text-slate-700">|</span>
            <div class="flex items-center gap-1.5">
                <span class="text-xs text-slate-400">Rastro:</span>
                <button id="btn-rastro-menos" class="w-6 h-6 bg-slate-800 hover:bg-slate-700 text-emerald-400 rounded flex items-center justify-center font-bold text-xs cursor-pointer" aria-label="Diminuir rastro">-</button>
                <span id="label-rastro" class="text-xs font-mono text-emerald-300 w-10 text-center">0.08</span>
                <button id="btn-rastro-mais" class="w-6 h-6 bg-slate-800 hover:bg-slate-700 text-emerald-400 rounded flex items-center justify-center font-bold text-xs cursor-pointer" aria-label="Aumentar rastro">+</button>
            </div>
            <span class="text-slate-700">|</span>
            <button id="btn-pausar" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium px-2.5 py-1 rounded border border-slate-700 cursor-pointer transition" aria-label="Pausar animação">Pausar</button>
        </div>
    </div>

    <script>
        const canvas = document.createElement('canvas');
        canvas.setAttribute('aria-hidden', 'true');
        document.body.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        const corFundo = '#0f1117';
        const coresFluido = ['atual', 'verde', 'vermelho'];
        let modoCorFluido = 'atual';

        const prefereMovimentoReduzido = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        let largura = canvas.width = window.innerWidth;
        let altura = canvas.height = window.innerHeight;

        let multVelocidade = prefereMovimentoReduzido ? 0.5 : 1.0;
        let trailAlpha = 0.08;
        let pausado = false;
        let pausadoPorVisibilidade = false;
        let animationFrameId = null;

        // --- CAMPO DE FLUÍDOS ---
        let particulasFluido = [];
        let seedAleatoriaFluido = Math.random() * 100;

        function quantidadeParticulas() {
            const base = Math.floor((largura * altura) / 1800);
            const maximo = prefereMovimentoReduzido ? 500 : 1100;
            return Math.max(250, Math.min(maximo, base));
        }

        function gerarCorFluido() {
            if (modoCorFluido === 'verde') {
                return [40 + Math.random() * 60, 170 + Math.random() * 70, 70 + Math.random() * 60];
            }
            if (modoCorFluido === 'vermelho') {
                return [190 + Math.random() * 65, 45 + Math.random() * 65, 45 + Math.random() * 65];
            }
            return [60 + Math.random() * 60, 140 + Math.random() * 60, 220 + Math.random() * 35];
        }

        function atualizarLabelPaleta() {
            const rotulos = { atual: 'atual', verde: 'verde', vermelho: 'vermelho' };
            document.getElementById('label-paleta').innerText = rotulos[modoCorFluido] || modoCorFluido;
        }

        function definirAlvosDeCor() {
            particulasFluido.forEach(p => {
                p.corAlvo = gerarCorFluido();
            });
        }

        function iniciarFluido() {
            seedAleatoriaFluido = Math.random() * 100;
            const total = quantidadeParticulas();
            particulasFluido = Array.from({ length: total }, () => {
                const cor = gerarCorFluido();
                return {
                    x: Math.random() * largura,
                    y: Math.random() * altura,
                    vx: 0,
                    vy: 0,
                    cor: cor.slice(),
                    corAlvo: cor.slice(),
                    tamanho: Math.random() * 2 + 1
                };
            });
            ctx.fillStyle = corFundo;
            ctx.fillRect(0, 0, largura, altura);
            atualizarLabelPaleta();
        }

        function trocarPaleta() {
            const opcoes = coresFluido.filter(c => c !== modoCorFluido);
            modoCorFluido = opcoes[Math.floor(Math.random() * opcoes.length)] || coresFluido[0];
            definirAlvosDeCor();
            atualizarLabelPaleta();
        }

        canvas.addEventListener('click', (e) => {
            if (e.target.closest && e.target.closest('#hud')) return;
            trocarPaleta();
        });

        window.addEventListener('resize', () => {
            largura = canvas.width = window.innerWidth;
            altura = canvas.height = window.innerHeight;
            iniciarFluido();
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                window.location.href = '../index.html';
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                pausadoPorVisibilidade = true;
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            } else {
                pausadoPorVisibilidade = false;
                if (!pausado && !animationFrameId) loop();
            }
        });

        function atualizarControles() {
            document.getElementById('label-vel').innerText = multVelocidade.toFixed(2) + 'x';
            document.getElementById('label-rastro').innerText = trailAlpha.toFixed(2);
            const btnPausar = document.getElementById('btn-pausar');
            btnPausar.innerText = pausado ? 'Retomar' : 'Pausar';
            btnPausar.setAttribute('aria-label', pausado ? 'Retomar animação' : 'Pausar animação');
        }

        document.getElementById('btn-vel-mais').onclick = () => {
            if (multVelocidade < 3.0) multVelocidade = parseFloat((multVelocidade + 0.25).toFixed(2));
            atualizarControles();
        };
        document.getElementById('btn-vel-menos').onclick = () => {
            if (multVelocidade > 0.25) multVelocidade = parseFloat((multVelocidade - 0.25).toFixed(2));
            atualizarControles();
        };
        document.getElementById('btn-rastro-mais').onclick = () => {
            if (trailAlpha < 0.30) trailAlpha = parseFloat((trailAlpha + 0.02).toFixed(2));
            atualizarControles();
        };
        document.getElementById('btn-rastro-menos').onclick = () => {
            if (trailAlpha > 0.02) trailAlpha = parseFloat((trailAlpha - 0.02).toFixed(2));
            atualizarControles();
        };
        document.getElementById('btn-pausar').onclick = () => {
            pausado = !pausado;
            atualizarControles();
            if (pausado) {
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            } else if (!pausadoPorVisibilidade) {
                loop();
            }
        };

        function lerpCor(atual, alvo, t) {
            for (let i = 0; i < 3; i++) {
                atual[i] += (alvo[i] - atual[i]) * t;
            }
        }

        function atualizarFluido() {
            ctx.fillStyle = `rgba(15, 17, 23, ${trailAlpha})`;
            ctx.fillRect(0, 0, largura, altura);

            const passo = prefereMovimentoReduzido ? Math.min(multVelocidade, 0.75) : multVelocidade;
            seedAleatoriaFluido += 0.00035 * passo;

            particulasFluido.forEach(p => {
                lerpCor(p.cor, p.corAlvo, 0.03 * passo);

                let ang = (Math.sin(p.x * 0.005 + seedAleatoriaFluido) + Math.cos(p.y * 0.005 + seedAleatoriaFluido)) * Math.PI * 2;
                p.vx += Math.cos(ang) * 0.1 * passo;
                p.vy += Math.sin(ang) * 0.1 * passo;
                p.vx *= 0.92;
                p.vy *= 0.92;
                p.x += p.vx * passo;
                p.y += p.vy * passo;

                if (p.x < 0) p.x = largura;
                if (p.x > largura) p.x = 0;
                if (p.y < 0) p.y = altura;
                if (p.y > altura) p.y = 0;

                ctx.fillStyle = `rgb(${p.cor[0] | 0},${p.cor[1] | 0},${p.cor[2] | 0})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.tamanho, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function loop() {
            if (pausado || pausadoPorVisibilidade) return;
            atualizarFluido();
            animationFrameId = requestAnimationFrame(loop);
        }

        atualizarControles();
        iniciarFluido();
        loop();
    </script>
</body>
</html>
