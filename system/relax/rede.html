<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rota de Rede com Datacenters - Fly Relaxamento</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            background-color: #0f1117;
            color: #c8d2e1;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body class="relative w-screen h-screen select-none">

    <!-- HUD DE NAVEGAÇÃO / SAÍDA -->
    <div id="hud" class="absolute top-4 left-4 z-40 flex flex-col gap-1 bg-slate-900/85 backdrop-blur border border-slate-800 px-4 py-2.5 rounded-xl shadow-lg max-w-[min(92vw,460px)]">
        <span id="titulo-modo-atual" class="text-xs md:text-sm text-slate-300 font-semibold">Rota de Rede com Datacenters</span>
        <div class="text-[11px] text-slate-400">Clique para enviar um e-mail</div>
        <div id="hud-latencia" class="text-[10px] text-amber-300/90">Local de latência muda a cada 30 segundos.</div>
    </div>

    <script>
        const canvas = document.createElement('canvas');
        document.body.appendChild(canvas);
        const ctx = canvas.getContext('2d');

        let largura = window.innerWidth;
        let altura = window.innerHeight;
        let dpr = Math.max(1, window.devicePixelRatio || 1);

        function ajustarCanvas() {
            largura = window.innerWidth;
            altura = window.innerHeight;
            dpr = Math.max(1, window.devicePixelRatio || 1);
            canvas.width = Math.floor(largura * dpr);
            canvas.height = Math.floor(altura * dpr);
            canvas.style.width = largura + 'px';
            canvas.style.height = altura + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.imageSmoothingEnabled = true;
        }

        ajustarCanvas();

        window.addEventListener('resize', () => {
            ajustarCanvas();
            iniciarRede();
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                window.location.href = '../index.html';
            }
        });

        let tempoGlobal = 0;
        let animationFrameId = null;
        let pausado = false;
        let proximaTrocaLatencia = 0;
        const INTERVALO_LATENCIA_MS = 30000;

        // --- IMPLEMENTAÇÃO: ROTA DE REDE COM DATACENTERS + LATÊNCIA ---
        let nosTeia = [];
        let conexoesTeia = [];
        let pacotesTeia = [];
        let nosComLatencia = new Set();
        let arestasComLatencia = new Set();

        function chaveAresta(a, b) {
            return a < b ? a + '-' + b : b + '-' + a;
        }

        function iniciarRede() {
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.fillStyle = '#0f1117'; ctx.fillRect(0, 0, largura, altura);
            nosTeia = [];
            conexoesTeia = [];
            pacotesTeia = [];
            nosComLatencia = new Set();
            arestasComLatencia = new Set();

            let larguraUtil = largura - 220;
            let alturaUtil = altura - 150;
            let margemX = 90;
            let margemY = 80;

            nosTeia.push({ id: 0, x: margemX, y: alturaUtil * 0.25 + margemY, tipo: 'lan', nome: 'PC (LAN)', nomeBase: 'PC (LAN)', icone: '💻', ultimoAtivo: -9999 });
            nosTeia.push({ id: 1, x: margemX, y: alturaUtil * 0.5 + margemY, tipo: 'lan', nome: 'Notebook', nomeBase: 'Notebook', icone: '💻', ultimoAtivo: -9999 });
            nosTeia.push({ id: 2, x: margemX, y: alturaUtil * 0.75 + margemY, tipo: 'lan', nome: 'Mobile/IoT', nomeBase: 'Mobile/IoT', icone: '📱', ultimoAtivo: -9999 });
            nosTeia.push({ id: 3, x: margemX + larguraUtil * 0.18, y: alturaUtil * 0.35 + margemY, tipo: 'router', nome: 'Roteador A', nomeBase: 'Roteador A', icone: '📡', ultimoAtivo: -9999 });
            nosTeia.push({ id: 4, x: margemX + larguraUtil * 0.18, y: alturaUtil * 0.65 + margemY, tipo: 'router', nome: 'Roteador B', nomeBase: 'Roteador B', icone: '📡', ultimoAtivo: -9999 });
            nosTeia.push({ id: 5, x: margemX + larguraUtil * 0.34, y: alturaUtil * 0.2 + margemY, tipo: 'isp', nome: 'Provedor OLT 1', nomeBase: 'Provedor OLT 1', icone: '🔌', ultimoAtivo: -9999 });
            nosTeia.push({ id: 6, x: margemX + larguraUtil * 0.34, y: alturaUtil * 0.5 + margemY, tipo: 'isp', nome: 'CGNAT / NAT', nomeBase: 'CGNAT / NAT', icone: '⚡', ultimoAtivo: -9999 });
            nosTeia.push({ id: 7, x: margemX + larguraUtil * 0.34, y: alturaUtil * 0.8 + margemY, tipo: 'isp', nome: 'Provedor OLT 2', nomeBase: 'Provedor OLT 2', icone: '🔌', ultimoAtivo: -9999 });
            nosTeia.push({ id: 8, x: margemX + larguraUtil * 0.5, y: alturaUtil * 0.15 + margemY, tipo: 'backbone', nome: 'Backbone SP-1', nomeBase: 'Backbone SP-1', icone: '🌐', ultimoAtivo: -9999 });
            nosTeia.push({ id: 9, x: margemX + larguraUtil * 0.5, y: alturaUtil * 0.4 + margemY, tipo: 'backbone', nome: 'IX.br Campinas', nomeBase: 'IX.br Campinas', icone: '🔀', ultimoAtivo: -9999 });
            nosTeia.push({ id: 10, x: margemX + larguraUtil * 0.5, y: alturaUtil * 0.65 + margemY, tipo: 'backbone', nome: 'Backbone SP-2', nomeBase: 'Backbone SP-2', icone: '🌐', ultimoAtivo: -9999 });
            nosTeia.push({ id: 11, x: margemX + larguraUtil * 0.5, y: alturaUtil * 0.88 + margemY, tipo: 'backbone', nome: 'Rota BGP Alt.', nomeBase: 'Rota BGP Alt.', icone: '🔄', ultimoAtivo: -9999 });
            nosTeia.push({ id: 12, x: margemX + larguraUtil * 0.68, y: alturaUtil * 0.22 + margemY, tipo: 'datacenter', nome: 'Datacenter SP', nomeBase: 'Datacenter SP', icone: '🏢', ultimoAtivo: -9999 });
            nosTeia.push({ id: 13, x: margemX + larguraUtil * 0.68, y: alturaUtil * 0.52 + margemY, tipo: 'datacenter', nome: 'Datacenter RJ', nomeBase: 'Datacenter RJ', icone: '🏢', ultimoAtivo: -9999 });
            nosTeia.push({ id: 14, x: margemX + larguraUtil * 0.68, y: alturaUtil * 0.78 + margemY, tipo: 'cloud', nome: 'CDN / Edge', nomeBase: 'CDN / Edge', icone: '☁️', ultimoAtivo: -9999 });
            nosTeia.push({ id: 15, x: largura - 90, y: alturaUtil * 0.5 + margemY, tipo: 'server', nome: 'Sua área de interesse', subnome: 'instagram, stream, ...', nomeBase: 'Sua área de interesse', icone: '🖥️', ultimoAtivo: -9999 });

            let paresConexoes = [
                [0, 3], [0, 4], [1, 3], [1, 4], [2, 3], [2, 4],
                [3, 5], [3, 6], [4, 6], [4, 7],
                [5, 6], [6, 7], [5, 8], [7, 11],
                [5, 9], [6, 9], [6, 10], [7, 10],
                [8, 9], [9, 10], [10, 11], [8, 10], [9, 11],
                [8, 12], [9, 12], [9, 13], [10, 13], [10, 14], [11, 14],
                [12, 13], [13, 14],
                [12, 15], [13, 15], [14, 15], [9, 15]
            ];
            paresConexoes.forEach(par => {
                conexoesTeia.push({ de: par[0], para: par[1] });
            });

            proximaTrocaLatencia = Date.now() + INTERVALO_LATENCIA_MS;
            aplicarLatencia(13);
        }

        function reconstruirArestasLatencia() {
            arestasComLatencia = new Set();
            conexoesTeia.forEach(par => {
                if (nosComLatencia.has(par.de) || nosComLatencia.has(par.para)) {
                    arestasComLatencia.add(chaveAresta(par.de, par.para));
                }
            });
        }

        function aplicarLatencia(noId) {
            nosTeia.forEach(n => {
                if (n.nomeBase != null) n.nome = n.nomeBase;
            });
            nosComLatencia = new Set();
            if (noId != null && nosTeia[noId] && nosTeia[noId].tipo !== 'server' && nosTeia[noId].tipo !== 'lan') {
                nosComLatencia.add(noId);
                const n = nosTeia[noId];
                n.nome = n.nomeBase + ' (latência)';
                const hud = document.getElementById('hud-latencia');
                if (hud) hud.textContent = 'Latência alta em: ' + n.nomeBase + ' (muda a cada 30 s).';
            } else {
                const hud = document.getElementById('hud-latencia');
                if (hud) hud.textContent = 'Local de latência muda a cada 30 segundos.';
            }
            reconstruirArestasLatencia();
        }

        function mudarLatenciaAleatoria() {
            const candidatos = nosTeia
                .filter(n => n.tipo !== 'lan' && n.tipo !== 'server')
                .map(n => n.id);
            if (candidatos.length === 0) return;
            let atual = null;
            nosComLatencia.forEach(id => { atual = id; });
            let opcoes = candidatos.filter(id => id !== atual);
            if (opcoes.length === 0) opcoes = candidatos;
            const escolhido = opcoes[Math.floor(Math.random() * opcoes.length)];
            aplicarLatencia(escolhido);
        }

        function fatorLatenciaAresta(noA, noB) {
            // Simula latência alta: mantém geração/quantidade de pacotes, mas reduz avanço nesse trecho.
            if (nosComLatencia.has(noA) || nosComLatencia.has(noB)) return 0.22;
            return 1;
        }

        function criarPacote(origemId, noProximo, tipo) {
            return {
                noAtual: origemId,
                noProximo: noProximo,
                progresso: 0,
                velocidade: (0.015 + Math.random() * 0.02) * 0.25,
                tipo: tipo || 'dados',
                direcao: 'ida',
                historico: [origemId, noProximo],
                frameInicio: tempoGlobal
            };
        }

        function escolherProximoSaltoIda(noAtualId) {
            let candidatas = conexoesTeia.filter(c => c.de === noAtualId);
            if (candidatas.length === 0) return null;
            const alvo = nosTeia[15];
            let melhorScore = -Infinity;
            let melhor = [];
            for (const c of candidatas) {
                const n = nosTeia[c.para];
                const dx = alvo.x - n.x;
                const dy = alvo.y - n.y;
                const dist = Math.hypot(dx, dy);
                // Favorece levemente a rota problemática para evidenciar o gargalo na simulação.
            const bonusLatencia = nosComLatencia.has(c.para) ? 20 : 0;
            const score = n.x * 2 - dist + bonusLatencia + Math.random() * 35;
                if (score > melhorScore + 8) {
                    melhorScore = score;
                    melhor = [c];
                } else if (score > melhorScore - 8) {
                    melhor.push(c);
                }
            }
            const pool = melhor.length ? melhor : candidatas;
            return pool[Math.floor(Math.random() * pool.length)];
        }

        function dispararMensagem() {
            if (nosTeia.length === 0) return;
            const origemId = Math.floor(Math.random() * 3);
            const conexoesOrigem = conexoesTeia.filter(c => c.de === origemId);
            if (conexoesOrigem.length === 0) return;

            const escolha = conexoesOrigem[Math.floor(Math.random() * conexoesOrigem.length)];
            pacotesTeia.push(criarPacote(escolha.de, escolha.para, 'mensagem'));
        }

        canvas.addEventListener('click', dispararMensagem);

        function atualizarRede() {
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.fillStyle = 'rgba(15, 17, 23, 0.2)'; ctx.fillRect(0, 0, largura, altura);

            // Geração/cadência preservadas.
            if (tempoGlobal % 50 === 0 && nosTeia.length > 0) {
                let origensLAN = [0, 1, 2];
                let origemId = origensLAN[Math.floor(Math.random() * origensLAN.length)];
                let conexoesOrigem = conexoesTeia.filter(c => c.de === origemId);
                if (conexoesOrigem.length > 0) {
                    let escolha = conexoesOrigem[Math.floor(Math.random() * conexoesOrigem.length)];
                    pacotesTeia.push(criarPacote(escolha.de, escolha.para, 'dados'));
                }
            }

            const destaqueAresta = new Map();
            const trilhaAresta = new Map();
            pacotesTeia.forEach(p => {
                const k = chaveAresta(p.noAtual, p.noProximo);
                destaqueAresta.set(k, p.direcao === 'volta' ? 'volta' : 'ida');
                if (p.historico && p.historico.length > 1) {
                    for (let i = 0; i < p.historico.length - 1; i++) {
                        const tk = chaveAresta(p.historico[i], p.historico[i + 1]);
                        if (!trilhaAresta.has(tk)) trilhaAresta.set(tk, p.direcao);
                    }
                }
            });

            conexoesTeia.forEach(c => {
                let n1 = nosTeia[c.de];
                let n2 = nosTeia[c.para];
                const k = chaveAresta(c.de, c.para);
                const ativo = destaqueAresta.get(k);
                const trilha = trilhaAresta.get(k);
                const lat = arestasComLatencia.has(k);
                if (lat) {
                    ctx.strokeStyle = ativo ? 'rgba(251, 146, 60, 0.75)' : (trilha ? 'rgba(251, 146, 60, 0.28)' : 'rgba(239, 68, 68, 0.22)');
                    ctx.lineWidth = ativo ? 2.6 : 1.8;
                    ctx.shadowColor = 'rgba(251, 146, 60, 0.25)';
                    ctx.shadowBlur = ativo ? 7 : 0;
                } else if (ativo === 'volta') {
                    ctx.strokeStyle = 'rgba(52, 211, 153, 0.55)';
                    ctx.lineWidth = 2.2;
                    ctx.shadowColor = 'rgba(52, 211, 153, 0.35)';
                    ctx.shadowBlur = 6;
                } else if (ativo === 'ida') {
                    ctx.strokeStyle = 'rgba(56, 189, 248, 0.5)';
                    ctx.lineWidth = 2.2;
                    ctx.shadowColor = 'rgba(56, 189, 248, 0.35)';
                    ctx.shadowBlur = 6;
                } else if (trilha === 'volta') {
                    ctx.strokeStyle = 'rgba(52, 211, 153, 0.18)';
                    ctx.lineWidth = 1.6;
                    ctx.shadowBlur = 0;
                } else if (trilha) {
                    ctx.strokeStyle = 'rgba(56, 189, 248, 0.16)';
                    ctx.lineWidth = 1.6;
                    ctx.shadowBlur = 0;
                } else {
                    ctx.strokeStyle = 'rgba(56, 189, 248, 0.12)';
                    ctx.lineWidth = 1.5;
                    ctx.shadowBlur = 0;
                }
                ctx.beginPath();
                ctx.moveTo(n1.x, n1.y);
                ctx.lineTo(n2.x, n2.y);
                ctx.stroke();
                ctx.shadowBlur = 0;
            });

            for (let idx = pacotesTeia.length - 1; idx >= 0; idx--) {
                const p = pacotesTeia[idx];
                // Base de velocidade preservada; trecho com latência aplica fator de simulação.
                p.progresso += p.velocidade * fatorLatenciaAresta(p.noAtual, p.noProximo);
                if (p.progresso >= 1) {
                    const chegouEm = p.noProximo;
                    if (nosTeia[chegouEm]) nosTeia[chegouEm].ultimoAtivo = tempoGlobal;

                    if (p.direcao === 'ida') {
                        if (chegouEm === 15) {
                            p.direcao = 'volta';
                            p.historico.pop();
                            const anterior = p.historico[p.historico.length - 1];
                            if (anterior == null) {
                                pacotesTeia.splice(idx, 1);
                                continue;
                            }
                            p.noAtual = 15;
                            p.noProximo = anterior;
                            p.progresso = 0;
                        } else {
                            const proxima = escolherProximoSaltoIda(chegouEm);
                            if (proxima) {
                                p.noAtual = proxima.de;
                                p.noProximo = proxima.para;
                                p.progresso = 0;
                                p.historico.push(proxima.para);
                            } else {
                                pacotesTeia.splice(idx, 1);
                                continue;
                            }
                        }
                    } else {
                        p.historico.pop();
                        if (p.historico.length <= 1) {
                            pacotesTeia.splice(idx, 1);
                            continue;
                        }
                        const anterior = p.historico[p.historico.length - 1];
                        p.noAtual = chegouEm;
                        p.noProximo = anterior;
                        p.progresso = 0;
                    }
                }

                const n1 = nosTeia[p.noAtual];
                const n2 = nosTeia[p.noProximo];
                if (!n1 || !n2) continue;
                let xAtual = n1.x + (n2.x - n1.x) * p.progresso;
                let yAtual = n1.y + (n2.y - n1.y) * p.progresso;

                if (p.tipo === 'mensagem') {
                    const corMsg = p.direcao === 'volta' ? '#34d399' : '#fbbf24';
                    const corMsgFill = p.direcao === 'volta' ? '#d1fae5' : '#fef3c7';
                    const corMsgStroke = p.direcao === 'volta' ? '#10b981' : '#f59e0b';
                    ctx.shadowColor = corMsg;
                    ctx.shadowBlur = 10;
                    ctx.fillStyle = corMsgFill;
                    ctx.fillRect(xAtual - 8, yAtual - 5, 16, 11);
                    ctx.strokeStyle = corMsgStroke;
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(xAtual - 8, yAtual - 5);
                    ctx.lineTo(xAtual, yAtual + 1);
                    ctx.lineTo(xAtual + 8, yAtual - 5);
                    ctx.moveTo(xAtual - 8, yAtual + 6);
                    ctx.lineTo(xAtual - 2, yAtual);
                    ctx.moveTo(xAtual + 8, yAtual + 6);
                    ctx.lineTo(xAtual + 2, yAtual);
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                } else {
                    const cor = p.direcao === 'volta' ? '#34d399' : '#38bdf8';
                    ctx.fillStyle = cor;
                    ctx.shadowColor = cor;
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.arc(xAtual, yAtual, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            nosTeia.forEach(n => {
                const ehServer = n.tipo === 'server';
                const ehLatencia = nosComLatencia.has(n.id);
                let corBorda = ehServer ? '#f472b6' : (n.tipo === 'lan' ? '#34d399' : (n.tipo === 'datacenter' ? '#a78bfa' : '#60a5fa'));
                if (ehLatencia) corBorda = '#f97316';
                const pulso = Math.max(0, 1 - (tempoGlobal - (n.ultimoAtivo || -9999)) / 18);
                if (pulso > 0) {
                    const corPulso = ehLatencia ? `rgba(251, 146, 60, ${0.15 + pulso * 0.45})` : (ehServer ? `rgba(244, 114, 182, ${0.18 + pulso * 0.5})` : `rgba(125, 211, 252, ${0.15 + pulso * 0.45})`);
                    ctx.strokeStyle = corPulso;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(n.x, n.y, 22 + pulso * 8, 0, Math.PI * 2);
                    ctx.stroke();
                }
                if (ehServer) {
                    ctx.shadowColor = 'rgba(244, 114, 182, 0.45)';
                    ctx.shadowBlur = 14;
                }
                ctx.fillStyle = ehLatencia ? '#3b2314' : (ehServer ? '#2a1530' : '#1e293b');
                ctx.strokeStyle = corBorda;
                ctx.lineWidth = ehLatencia ? 2.5 : (ehServer ? 2.8 : 2);
                ctx.beginPath();
                ctx.arc(n.x, n.y, 22, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.shadowBlur = 0;

                ctx.font = '14px system-ui';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ffffff';
                ctx.fillText(n.icone, n.x, n.y);

                ctx.textBaseline = 'top';
                ctx.fillStyle = ehLatencia ? '#fdba74' : (ehServer ? '#fbcfe8' : '#f8fafc');
                ctx.font = ehLatencia ? 'bold 10px system-ui' : (ehServer ? 'bold 10px system-ui' : '10px system-ui');
                ctx.fillText(n.nome, n.x, n.y + 26);
                if (n.subnome) {
                    ctx.fillStyle = ehLatencia ? '#fdba74' : 'rgba(248, 250, 252, 0.72)';
                    ctx.font = '8.5px system-ui';
                    ctx.fillText(n.subnome, n.x, n.y + 38);
                }
            });
        }

        function loop() {
            if (pausado) return;
            if (nosTeia.length > 0 && Date.now() >= proximaTrocaLatencia) {
                mudarLatenciaAleatoria();
                proximaTrocaLatencia = Date.now() + INTERVALO_LATENCIA_MS;
            }
            tempoGlobal++;
            atualizarRede();
            animationFrameId = requestAnimationFrame(loop);
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                pausado = true;
                if (animationFrameId != null) cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            } else if (pausado) {
                pausado = false;
                animationFrameId = requestAnimationFrame(loop);
            }
        });

        iniciarRede();
        loop();
    </script>
</body>
</html>
