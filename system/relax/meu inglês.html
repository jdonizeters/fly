<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Vocabulary Master</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes bounce-short {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .animate-bounce-short { animation: bounce-short 0.3s ease-in-out; }
    .animate-shake { animation: shake 0.4s ease-in-out; }
    .icon { display: inline-flex; width: 1.25rem; height: 1.25rem; vertical-align: middle; }
    .icon svg { width: 100%; height: 100%; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen overflow-hidden flex flex-col font-sans">

  <!-- Header / Barra Superior -->
  <header class="bg-slate-800 border-b border-slate-700 px-3 py-2 z-10 shadow-md shrink-0">
    <div class="max-w-5xl mx-auto flex flex-wrap items-center gap-2">
      <div class="flex items-center gap-2 mr-1">
        <span class="icon text-indigo-400" style="width:1.25rem;height:1.25rem" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.46 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.46 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></svg>
        </span>
        <h1 class="text-base sm:text-lg font-bold tracking-wide whitespace-nowrap">English Vocab Master</h1>
      </div>

      <div class="flex items-center gap-1.5">
        <label for="filter-category" class="text-[11px] text-slate-400 font-semibold uppercase">Filtrar:</label>
        <select id="filter-category" class="bg-slate-700 text-slate-200 text-xs rounded-lg px-2 py-1 border border-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="all">Todas (350)</option>
          <option value="expression">Expressões (50)</option>
          <option value="phrase">Frases (50)</option>
          <option value="verb">Verbos (50)</option>
          <option value="number">Números (50)</option>
          <option value="direction">Direções (50)</option>
          <option value="adjective">Adjetivos (50)</option>
          <option value="noun">Substantivos (50)</option>
        </select>
      </div>

      <div class="flex flex-wrap items-center gap-1.5 ml-auto">
        <button id="btn-export" class="bg-slate-700/80 hover:bg-slate-700 border border-slate-600 text-[11px] text-slate-200 py-1 px-2 rounded-lg transition flex items-center gap-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500" title="Exportar progresso">
          <span class="icon text-indigo-400" style="width:0.95rem;height:0.95rem" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></span><span class="hidden sm:inline">Exportar</span>
        </button>
        <label class="bg-slate-700/80 hover:bg-slate-700 border border-slate-600 text-[11px] text-slate-200 py-1 px-2 rounded-lg transition flex items-center gap-1.5 cursor-pointer focus-within:ring-2 focus-within:ring-emerald-500" title="Restaurar progresso">
          <span class="icon text-emerald-400" style="width:0.95rem;height:0.95rem" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></span><span class="hidden sm:inline">Restaurar</span>
          <input type="file" id="import-file" accept=".json" class="hidden">
        </label>
        <button id="btn-sound" type="button" aria-pressed="true" title="Ativar/desativar som das respostas" class="bg-slate-700/80 hover:bg-slate-700 border border-slate-600 text-[11px] text-slate-200 py-1 px-2 rounded-lg transition flex items-center gap-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <span id="btn-sound-icon" class="icon text-indigo-400" style="width:0.95rem;height:0.95rem" aria-hidden="true"></span>
          <span id="btn-sound-label">Som</span>
        </button>
        <button id="btn-review" class="bg-slate-700/80 hover:bg-slate-700 border border-slate-600 text-[11px] text-amber-300 py-1 px-2 rounded-lg transition flex items-center gap-1.5 focus:outline-none focus:ring-2 focus:ring-amber-500" title="Revisar erros">
          <span class="icon" style="width:0.95rem;height:0.95rem" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span><span class="hidden sm:inline">Erros</span> (<span id="wrong-count-badge">0</span>)
        </button>
        <button id="btn-reset" class="bg-slate-700/80 hover:bg-rose-900/60 border border-slate-600 hover:border-rose-700/60 text-[11px] text-rose-300 py-1 px-2 rounded-lg transition flex items-center gap-1.5 focus:outline-none focus:ring-2 focus:ring-rose-500" title="Resetar números">
          <span class="icon" style="width:0.95rem;height:0.95rem" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></span><span class="hidden sm:inline">Resetar</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Painel Principal / Jogo -->
  <main class="max-w-3xl w-full mx-auto px-3 py-2 flex-1 min-h-0 flex flex-col justify-center gap-2">

    <!-- Painel de Estatísticas -->
    <div class="grid grid-cols-3 sm:grid-cols-6 gap-1.5 sm:gap-2 shrink-0" aria-live="polite" aria-atomic="false">
      <div class="bg-slate-800/80 border border-slate-700 rounded-lg px-2 py-1.5 text-center shadow">
        <span class="text-[10px] sm:text-[11px] text-slate-400 uppercase font-semibold block leading-tight">Acertos</span>
        <span id="score-correct" class="text-lg sm:text-xl font-bold text-emerald-400 leading-tight">0</span>
      </div>
      <div class="bg-slate-800/80 border border-slate-700 rounded-lg px-2 py-1.5 text-center shadow">
        <span class="text-[10px] sm:text-[11px] text-slate-400 uppercase font-semibold block leading-tight">Erros</span>
        <span id="score-wrong" class="text-lg sm:text-xl font-bold text-rose-400 leading-tight">0</span>
      </div>
      <div class="bg-slate-800/80 border border-slate-700 rounded-lg px-2 py-1.5 text-center shadow">
        <span class="text-[10px] sm:text-[11px] text-slate-400 uppercase font-semibold block leading-tight">Não sei</span>
        <span id="score-dontknow" class="text-lg sm:text-xl font-bold text-sky-400 leading-tight">0</span>
      </div>
      <div class="bg-slate-800/80 border border-slate-700 rounded-lg px-2 py-1.5 text-center shadow">
        <span class="text-[10px] sm:text-[11px] text-slate-400 uppercase font-semibold block leading-tight">Precisão</span>
        <span id="score-accuracy" class="text-lg sm:text-xl font-bold text-indigo-400 leading-tight">0%</span>
      </div>
      <div class="bg-slate-800/80 border border-slate-700 rounded-lg px-2 py-1.5 text-center shadow">
        <span class="text-[10px] sm:text-[11px] text-slate-400 uppercase font-semibold block leading-tight">Combo</span>
        <span id="score-streak" class="text-lg sm:text-xl font-bold text-amber-400 leading-tight">0 🔥</span>
      </div>
      <div class="bg-slate-800/80 border border-slate-700 rounded-lg px-2 py-1.5 text-center shadow">
        <span class="text-[10px] sm:text-[11px] text-slate-400 uppercase font-semibold block leading-tight">Vistas</span>
        <span id="score-seen" class="text-lg sm:text-xl font-bold text-slate-200 leading-tight">0</span>
      </div>
    </div>

    <!-- Card Principal de Questão -->
    <div id="game-card" class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 sm:px-4 sm:py-3 shadow-xl relative overflow-hidden transition-all min-h-0">

      <!-- Header do Card: Tag da Categoria + Ouvir Pronúncia -->
      <div class="flex justify-between items-center mb-2">
        <span id="word-badge" class="bg-indigo-900/60 text-indigo-300 text-[11px] font-semibold px-2.5 py-0.5 rounded-full border border-indigo-700/50">
          Carregando...
        </span>
        <button id="btn-speak" title="Ouvir Pronúncia (S)" aria-label="Ouvir pronúncia" class="text-slate-400 hover:text-indigo-400 p-1.5 rounded-full hover:bg-slate-700 transition focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <span class="icon" style="width:1.1rem;height:1.1rem" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg></span>
        </button>
      </div>

      <!-- Palavra/Frase em Inglês -->
      <div class="text-center my-1.5 sm:my-2">
        <h2 id="word-display" class="text-xl sm:text-2xl md:text-3xl font-extrabold text-slate-50 tracking-wide leading-tight">
          ---
        </h2>
        <p id="word-ipa" class="text-xs sm:text-sm font-mono text-slate-400 italic mt-0.5">/---/</p>
      </div>

      <p id="mode-hint" class="hidden text-center text-[11px] text-amber-300 mb-1">Modo: praticando apenas erros</p>

      <!-- Opções de Escolha (3 botões) -->
      <div id="options-container" class="grid grid-cols-1 gap-1.5 sm:gap-2 my-2" role="group" aria-label="Opções de resposta">
        <!-- Renderizado dinamicamente via JS -->
      </div>

      <!-- Feedback e Próxima Questão -->
      <div id="feedback-container" class="hidden text-center mt-2 pt-2 border-t border-slate-700/60" aria-live="polite">
        <p id="feedback-text" class="text-sm sm:text-base font-semibold mb-1.5"></p>
        <button id="btn-next" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-1.5 px-4 rounded-lg transition shadow-lg inline-flex items-center gap-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
          <span>Próxima</span>
          <span class="icon" style="width:0.85rem;height:0.85rem" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></span>
        </button>
        <p class="text-[10px] text-slate-500 mt-1">1–4 escolher • Enter próxima • S ouvir • Esc revisão</p>
      </div>
    </div>
  </main>

  <!-- Rodapé com Isenção de Responsabilidade -->
  <footer class="bg-slate-950 border-t border-slate-800 py-1 px-3 text-center text-[10px] sm:text-[11px] text-slate-500 shrink-0">
    Elaborado por IA usando criatividade humana, pode conter erros.
  </footer>

  <!-- Modal de Revisão de Erros -->
  <div id="review-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50" role="dialog" aria-modal="true" aria-labelledby="review-title">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl flex flex-col max-h-[80vh]">
      <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-700">
        <h3 id="review-title" class="text-lg font-bold text-slate-100 flex items-center gap-2">
          <span class="icon text-amber-400" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span> Lista de Palavras para Revisão
        </h3>
        <button id="btn-close-review" class="text-slate-400 hover:text-slate-100 p-1 focus:outline-none focus:ring-2 focus:ring-indigo-500 rounded" aria-label="Fechar revisão">
          <span class="icon" style="width:1.35rem;height:1.35rem" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span>
        </button>
      </div>
      <div class="flex gap-2 mb-3 flex-wrap">
        <button id="btn-practice-errors" class="bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold py-2 px-3 rounded-lg transition focus:outline-none focus:ring-2 focus:ring-amber-400">Praticar só erros</button>
        <button id="btn-practice-all" class="bg-slate-700 hover:bg-slate-600 text-slate-100 text-xs font-semibold py-2 px-3 rounded-lg transition focus:outline-none focus:ring-2 focus:ring-indigo-400">Voltar ao modo normal</button>
      </div>
      <div id="review-list" class="overflow-y-auto space-y-2 pr-2 flex-1">
        <!-- Itens inseridos via JS -->
      </div>
    </div>
  </div>

  <script>
    const ICONS = {
      circle: '<span class="icon text-slate-500" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg></span>',
      check: '<span class="icon text-emerald-400 text-lg" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="8 12 11 15 16 9"/></svg></span>',
      xmark: '<span class="icon text-rose-400 text-lg" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg></span>'

 "Life", "portuguese": "Vida", "category": "Substantivo", "type": "noun", "ipa": "/laɪf/"}, {"english": "Door", "portuguese": "Porta", "category": "Substantivo", "type": "noun", "ipa": "/dɔːr/"}, {"english": "Window", "portuguese": "Janela", "category": "Substantivo", "type": "noun", "ipa": "/ˈwɪn.dəʊ/"}, {"english": "Table", "portuguese": "Mesa", "category": "Substantivo", "type": "noun", "ipa": "/ˈteɪ.bəl/"}, {"english": "Chair", "portuguese": "Cadeira", "category": "Substantivo", "type": "noun", "ipa": "/tʃeər/"}, {"english": "Music", "portuguese": "Música", "category": "Substantivo", "type": "noun", "ipa": "/ˈmjuː.zɪk/"}];
    const STORAGE_KEY = 'vocabMasterStats';
    const SOUND_KEY = 'vocabMasterAnswerSound';
    let vocabularyBank = [];

    let stats = { correct: 0, wrong: 0, dontKnow: 0, streak: 0, seen: 0, wrongList: [] };
    let currentFilter = 'all';

    const el = {};
    function cacheEls() {
      ['filter-category','score-correct','score-wrong','score-dontknow','score-accuracy','score-streak','score-seen',
       'game-card','word-badge','word-display','word-ipa','options-container','feedback-container',
       'feedback-text','wrong-count-badge','review-modal','review-list','btn-speak','btn-next',
       'btn-export','import-file','btn-review','btn-reset','btn-close-review','btn-practice-errors','btn-practice-all','mode-hint',
       'btn-sound','btn-sound-icon','btn-sound-label'
      ].forEach(id => { el[id] = document.getElementById(id); });
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function sampleDistinct(arr, count, excludeValue) {
      const result = [];
      const used = new Set();
      let attempts = 0;
      while (result.length < count && attempts < 200) {
        attempts++;
        const item = arr[Math.floor(Math.random() * arr.length)];
        if (!item || item.portuguese === excludeValue || used.has(item.portuguese)) continue;
        used.add(item.portuguese);
        result.push(item.portuguese);
      }
      return result;
    }

    function loadStats() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (typeof data.correct === 'number' && typeof data.wrong === 'number') {
          stats = {
            correct: data.correct || 0,
            wrong: data.wrong || 0,
            dontKnow: data.dontKnow || 0,
            streak: data.streak || 0,
            seen: data.seen || 0,
            wrongList: Array.isArray(data.wrongList) ? data.wrongList : []
          };
        }
      } catch (e) {}
    }

    function saveStats() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(stats)); } catch (e) {}
    }

    function loadSoundSetting() {
      try {
        const raw = localStorage.getItem(SOUND_KEY);
        if (raw === '0' || raw === 'false') answerSound = false;
        else if (raw === '1' || raw === 'true') answerSound = true;
      } catch (e) {}
      updateSoundUI();
    }

    function saveSoundSetting() {
      try { localStorage.setItem(SOUND_KEY, answerSound ? '1' : '0'); } catch (e) {}
    }

    function updateSoundUI() {
      if (!el['btn-sound']) return;
      const on = !!answerSound;
      el['btn-sound'].setAttribute('aria-pressed', on ? 'true' : 'false');
      el['btn-sound-label'].innerText = on ? 'Som' : 'Mudo';
      el['btn-sound'].title = on ? 'Desativar som das respostas' : 'Ativar som das respostas';
      el['btn-sound-icon'].className = 'icon ' + (on ? 'text-indigo-400' : 'text-slate-500');
      el['btn-sound-icon'].innerHTML = on
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>';
    }

    function toggleAnswerSound() {
      answerSound = !answerSound;
      saveSoundSetting();
      updateSoundUI();
    }

    function buildPools() {
      poolsByType = { all: vocabularyBank };
      vocabularyBank.forEach(item => {
        const t = item.type || 'other';
        if (!poolsByType[t]) poolsByType[t] = [];
        poolsByType[t].push(item);
      });
    }

    function getActivePool() {
      if (practiceErrorsMode) {
        if (stats.wrongList.length > 0) return stats.wrongList;
        practiceErrorsMode = false;
        el['mode-hint'].classList.add('hidden');
      }
      return poolsByType[currentFilter] || poolsByType.all || vocabularyBank;
    }

    function pickWord(pool) {
      if (pool.length <= 1) return pool[0] || null;
      let candidate = pool[Math.floor(Math.random() * pool.length)];
      let tries = 0;
      while (currentWord && candidate && candidate.english === currentWord.english && tries < 8) {
        candidate = pool[Math.floor(Math.random() * pool.length)];
        tries++;
      }
      return candidate;
    }

    function generateOptions() {
      const correctText = currentWord.portuguese;
      let distractorPool = poolsByType[currentWord.type] || poolsByType.all || vocabularyBank;
      let wrongs = sampleDistinct(distractorPool, 2, correctText);
      if (wrongs.length < 2) wrongs = sampleDistinct(vocabularyBank, 2, correctText);
      return shuffle([correctText, ...wrongs.slice(0, 2)]);
    }

    function loadQuestion() {
      const pool = getActivePool();
      if (!pool || pool.length === 0) {
        el['word-badge'].innerText = 'Sem dados';
        el['word-display'].innerText = 'Carregue o vocabulário';
        el['word-ipa'].innerText = '';
        el['options-container'].innerHTML = '';
        return;
      }
      currentWord = pickWord(pool);
      if (!currentWord) return;
      answered = false;
      stats.seen = (stats.seen || 0) + 1;
      saveStats();
      updateStatsUI();

      el['word-badge'].innerText = currentWord.category;
      el['word-display'].innerText = currentWord.english;
      el['word-ipa'].innerText = currentWord.ipa || '';
      el['feedback-container'].classList.add('hidden');
      el['mode-hint'].classList.toggle('hidden', !practiceErrorsMode);

      currentOptions = generateOptions();
      renderOptions();
    }

    const DONT_KNOW = '__DONT_KNOW__';

    function renderOptions() {
      el['options-container'].innerHTML = '';
      const allOptions = [...currentOptions, DONT_KNOW];
      allOptions.forEach((optionText, idx) => {
        const isDontKnow = optionText === DONT_KNOW;
        const label = isDontKnow ? 'Não sei' : optionText;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.dataset.value = optionText;
        btn.dataset.index = String(idx + 1);
        btn.className = isDontKnow
          ? "w-full text-left bg-slate-800/60 hover:bg-slate-700/80 border border-dashed border-slate-500 hover:border-sky-400/60 text-slate-300 font-medium py-2 px-3 sm:py-2.5 sm:px-4 rounded-lg transition duration-150 shadow-sm flex items-center justify-between text-sm focus:outline-none focus:ring-2 focus:ring-sky-500"
          : "w-full text-left bg-slate-700/60 hover:bg-slate-700 border border-slate-600/80 hover:border-indigo-500/50 text-slate-100 font-medium py-2 px-3 sm:py-2.5 sm:px-4 rounded-lg transition duration-150 shadow-sm flex items-center justify-between text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500";
        btn.innerHTML = `<span><span class="text-slate-400 text-[11px] mr-1.5">${idx + 1}.</span>${escapeHtml(label)}</span>${ICONS.circle}`;
        btn.addEventListener('click', () => checkAnswer(optionText, btn));
        el['options-container'].appendChild(btn);
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function checkAnswer(selectedOption, buttonElement) {
      if (answered) return;
      answered = true;
      const allButtons = el['options-container'].querySelectorAll('button');
      allButtons.forEach(btn => btn.disabled = true);

      if (selectedOption === DONT_KNOW) {
        stats.dontKnow = (stats.dontKnow || 0) + 1;
        stats.streak = 0;
        if (!stats.wrongList.some(w => w.english === currentWord.english)) {
          stats.wrongList.push(currentWord);
        }
        buttonElement.className = "w-full text-left bg-sky-950/70 border-2 border-sky-500 text-sky-200 font-bold py-2 px-3 sm:py-2.5 sm:px-4 rounded-lg flex items-center justify-between text-sm";
        buttonElement.innerHTML = `<span><span class="text-slate-400 text-[11px] mr-1.5">${buttonElement.dataset.index}.</span>Não sei</span>${ICONS.circle}`;
        allButtons.forEach(btn => {
          if (btn.dataset.value === currentWord.portuguese) {
            btn.className = "w-full text-left bg-emerald-950/50 border border-emerald-600 text-emerald-300 font-medium py-2 px-3 sm:py-2.5 sm:px-4 rounded-lg flex items-center justify-between text-sm";
            btn.innerHTML = `<span><span class="text-slate-400 text-[11px] mr-1.5">${btn.dataset.index}.</span>${escapeHtml(btn.dataset.value)}</span>${ICONS.check}`;
          }
        });
        el['feedback-text'].innerText = `ℹ️ Você marcou "Não sei". O correto é: "${currentWord.portuguese}"`;
        el['feedback-text'].className = "text-sm sm:text-base font-bold text-sky-300 mb-1.5";
        playTone(330, 0.12);
      } else if (selectedOption === currentWord.portuguese) {
        stats.correct++;
        stats.streak++;
        if (practiceErrorsMode) {
          stats.wrongList = stats.wrongList.filter(w => w.english !== currentWord.english);
        }
        buttonElement.className = "w-full text-left bg-emerald-950/80 border-2 border-emerald-500 text-emerald-200 font-bold py-2 px-3 sm:py-2.5 sm:px-4 rounded-lg animate-bounce-short flex items-center justify-between text-sm";
        buttonElement.innerHTML = `<span><span class="text-slate-400 text-[11px] mr-1.5">${buttonElement.dataset.index}.</span>${escapeHtml(selectedOption)}</span>${ICONS.check}`;
        el['feedback-text'].innerText = "✨ Excelente! Resposta Correta.";
        el['feedback-text'].className = "text-sm sm:text-base font-bold text-emerald-400 mb-1.5";
        playTone(587, 0.15);
      } else {
        stats.wrong++;
        stats.streak = 0;
        if (!stats.wrongList.some(w => w.english === currentWord.english)) {
          stats.wrongList.push(currentWord);
        }
        buttonElement.className = "w-full text-left bg-rose-950/80 border-2 border-rose-500 text-rose-200 font-bold py-2 px-3 sm:py-2.5 sm:px-4 rounded-lg animate-shake flex items-center justify-between text-sm";
        buttonElement.innerHTML = `<span><span class="text-slate-400 text-[11px] mr-1.5">${buttonElement.dataset.index}.</span>${escapeHtml(selectedOption)}</span>${ICONS.xmark}`;
        allButtons.forEach(btn => {
          if (btn.dataset.value === currentWord.portuguese) {
            btn.className = "w-full text-left bg-emerald-950/50 border border-emerald-600 text-emerald-300 font-medium py-2 px-3 sm:py-2.5 sm:px-4 rounded-lg flex items-center justify-between text-sm";
            btn.innerHTML = `<span><span class="text-slate-400 text-[11px] mr-1.5">${btn.dataset.index}.</span>${escapeHtml(btn.dataset.value)}</span>${ICONS.check}`;
          }
        });
        el['feedback-text'].innerText = `❌ Incorreto. O correto é: "${currentWord.portuguese}"`;
        el['feedback-text'].className = "text-sm sm:text-base font-bold text-rose-400 mb-1.5";
        playTone(220, 0.25);
      }

      saveStats();
      updateStatsUI();
      el['feedback-container'].classList.remove('hidden');
      el['btn-next'].focus();
    }

    function nextQuestion() { loadQuestion(); }

    function updateStatsUI() {
      el['score-correct'].innerText = stats.correct;
      el['score-wrong'].innerText = stats.wrong;
      el['score-dontknow'].innerText = stats.dontKnow || 0;
      el['score-streak'].innerText = `${stats.streak} 🔥`;
      el['score-seen'].innerText = stats.seen || 0;
      const total = stats.correct + stats.wrong;
      const acc = total > 0 ? Math.round((stats.correct / total) * 100) : 0;
      el['score-accuracy'].innerText = `${acc}%`;
      el['wrong-count-badge'].innerText = stats.wrongList.length;
    }

    function speakWord() {
      if (!currentWord || !('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(currentWord.english);
      utterance.lang = 'en-US';
      speechSynthesis.speak(utterance);
    }

    let audioCtx;
    function playTone(freq, duration) {
      if (!answerSound) return;
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function exportJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(stats, null, 2));
      const a = document.createElement('a');
      a.setAttribute("href", dataStr);
      a.setAttribute("download", "vocab_master_progress.json");
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function importJSON(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedData = JSON.parse(e.target.result);
          if (typeof importedData.correct === 'number' && typeof importedData.wrong === 'number') {
            stats = {
              correct: importedData.correct || 0,
              wrong: importedData.wrong || 0,
              dontKnow: importedData.dontKnow || 0,
              streak: importedData.streak || 0,
              seen: importedData.seen || 0,
              wrongList: Array.isArray(importedData.wrongList) ? importedData.wrongList : []
            };
            saveStats();
            updateStatsUI();
            alert("Progresso restaurado com sucesso!");
          } else {
            alert("Arquivo JSON em formato inválido.");
          }
        } catch (err) {
          alert("Erro ao ler o arquivo JSON.");
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function toggleReviewModal(show) {
      const modal = el['review-modal'];
      const open = typeof show === 'boolean' ? show : modal.classList.contains('hidden');
      if (open) {
        lastReviewFocus = document.activeElement;
        renderReviewList();
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        el['btn-close-review'].focus();
      } else {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        if (lastReviewFocus && lastReviewFocus.focus) lastReviewFocus.focus();
      }
    }

    function renderReviewList() {
      const list = el['review-list'];
      list.innerHTML = '';
      if (stats.wrongList.length === 0) {
        list.innerHTML = '<p class="text-sm text-slate-400 text-center py-4">Nenhum erro registrado até o momento! 🎉</p>';
        return;
      }
      stats.wrongList.forEach(item => {
        const div = document.createElement('div');
        div.className = "bg-slate-700/50 border border-slate-600/60 p-3 rounded-lg flex justify-between items-center text-sm gap-3";
        div.innerHTML = `
          <div>
            <span class="font-bold text-slate-100">${escapeHtml(item.english)}</span>
            <span class="text-xs text-slate-400 block">${escapeHtml(item.category || '')}</span>
          </div>
          <span class="text-emerald-400 font-medium text-right">${escapeHtml(item.portuguese)}</span>
        `;
        list.appendChild(div);
      });
    }

    function setPracticeErrorsMode(on) {
      if (on && stats.wrongList.length === 0) {
        alert('Não há erros para praticar.');
        return;
      }
      practiceErrorsMode = !!on;
      el['mode-hint'].classList.toggle('hidden', !practiceErrorsMode);
      toggleReviewModal(false);
      loadQuestion();
    }

    function resetStats() {
      if (!confirm('Resetar todos os números (acertos, erros, não sei, combo, vistas e lista de erros)?')) return;
      stats = { correct: 0, wrong: 0, dontKnow: 0, streak: 0, seen: 0, wrongList: [] };
      practiceErrorsMode = false;
      el['mode-hint'].classList.add('hidden');
      saveStats();
      updateStatsUI();
      toggleReviewModal(false);
      loadQuestion();
    }

    function onKeyDown(e) {
      if (e.key === 'Escape' && !el['review-modal'].classList.contains('hidden')) {
        e.preventDefault();
        toggleReviewModal(false);
        return;
      }
      if (!el['review-modal'].classList.contains('hidden')) return;
      const tag = (e.target && e.target.tagName) || '';
      if (tag === 'SELECT' || tag === 'INPUT' || tag === 'TEXTAREA') return;

      if (!answered && ['1','2','3','4'].includes(e.key)) {
        const idx = Number(e.key) - 1;
        const btn = el['options-container'].querySelectorAll('button')[idx];
        if (btn && !btn.disabled) { e.preventDefault(); btn.click(); }
        return;
      }
      if (answered && (e.key === 'Enter' || e.key === 'n' || e.key === 'N')) {
        e.preventDefault(); nextQuestion(); return;
      }
      if (e.key === 's' || e.key === 'S') {
        e.preventDefault(); speakWord(); return;
      }
    }

    async function init() {
      cacheEls();
      loadStats();
      loadSoundSetting();
      updateStatsUI();

      el['filter-category'].addEventListener('change', () => {
        currentFilter = el['filter-category'].value;
        if (currentFilter !== 'all') practiceErrorsMode = false;
        loadQuestion();
      });
      el['btn-speak'].addEventListener('click', speakWord);
      el['btn-next'].addEventListener('click', nextQuestion);
      el['btn-export'].addEventListener('click', exportJSON);
      el['import-file'].addEventListener('change', importJSON);
      el['btn-sound'].addEventListener('click', toggleAnswerSound);
      el['btn-review'].addEventListener('click', () => toggleReviewModal());
      el['btn-reset'].addEventListener('click', resetStats);
      el['btn-close-review'].addEventListener('click', () => toggleReviewModal(false));
      el['btn-practice-errors'].addEventListener('click', () => setPracticeErrorsMode(true));
      el['btn-practice-all'].addEventListener('click', () => setPracticeErrorsMode(false));
      el['review-modal'].addEventListener('click', (e) => { if (e.target === el['review-modal']) toggleReviewModal(false); });
      document.addEventListener('keydown', onKeyDown);

      try {
        const res = await fetch('vocab.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (!Array.isArray(data) || data.length === 0) throw new Error('Formato inválido');
        vocabularyBank = data;
      } catch (err) {
        console.warn('Usando vocabulário embutido (fetch de vocab.json indisponível).', err);
        vocabularyBank = Array.isArray(VOCAB_FALLBACK) ? VOCAB_FALLBACK : [];
      }
      if (!vocabularyBank.length) {
        el['word-badge'].innerText = 'Erro';
        el['word-display'].innerText = 'Vocabulário indisponível';
        el['word-ipa'].innerText = '';
        el['options-container'].innerHTML = '';
        return;
      }
      buildPools();
      loadQuestion();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
